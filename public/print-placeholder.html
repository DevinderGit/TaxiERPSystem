<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Print — Placeholder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0c0c0e; color: #f5f5f7; font: 15px/1.5 system-ui, sans-serif;
    }
    .placeholder {
      max-width: 540px; padding: 2rem 2.5rem; text-align: center;
      background: #16161a; border: 1px solid #2a2a30; border-radius: 12px;
    }
    h1 { margin: 0 0 0.4rem; font-size: 1.4rem; color: #facc15; }
    p  { margin: 0.6rem 0; color: #9ca3af; }
    code { background: #1f1f24; padding: 0.1rem 0.45rem; border-radius: 4px; color: #facc15; }
  </style>
</head>
<body>
  <div class="placeholder">
    <h1>PDF rendering coming in M11</h1>
    <p id="kind-line"><span id="kind-label">Duty Slip</span> <code id="doc-no">DS-0001</code></p>
    <p>The full PDF template (TAXI-1101) will replace this placeholder.</p>
  </div>
  <script>
    // Reads ?duty_slip_no=<no> or ?bill_no=<no> from the query string and
    // updates the heading. The label switches to "Bill" when bill_no is
    // passed; defaults to "Duty Slip".
    var p = new URLSearchParams(location.search);
    var ds = p.get('duty_slip_no');
    var bn = p.get('bill_no');
    if (bn) {
      document.getElementById('kind-label').textContent = 'Bill';
      document.getElementById('doc-no').textContent = bn;
    } else if (ds) {
      document.getElementById('doc-no').textContent = ds;
    }
  </script>
</body>
</html>
